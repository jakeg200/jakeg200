services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: warrant
      POSTGRES_PASSWORD: warrant
      POSTGRES_DB: warrant
    ports:
      - "5432:5432"
    volumes:
      - warrant-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warrant"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  warrant-pgdata:
